# Titles and text for the folders on https://data.teemlabs.org. The top-level folders are the collections, shown on the
# landing page in this order; a deeper folder can be listed too, for its card on its parent's page and the top of its own:
# a collection's subfolders are its datasets (lulc/esa), and a dataset's are its derived products (lulc/esa/seals7). Edit freely: the pages pick up the change the next time they are built (after every real publish, or with
# hb.write_base_data_index_pages). A published folder missing here still gets a page and a card, titled by its folder name,
# with the first sentence of its ingestion script's docstring as its tagline and the first paragraph as its text; list it
# here to say it better. The landing page also lists every published folder as a tree, from the same texts.
#   title:   its name
#   tagline: one line, shown under the title
#   about:   a short paragraph, shown on its card and at the top of its own page (plain text)

pyramids:
  title: Pyramids
  tagline: Canonical grids for consistent computation
  about: >-
    Hectares-per-cell rasters for every rung of the POG lattice, 10 arcseconds to 180 degrees, exact from the WGS84
    ellipsoid. Every base data raster aligns to one.

lulc:
  title: Land use and land cover
  tagline: Categorical global land-cover maps
  about: >-
    Global land-cover time series as categorical POGs, each keeping its source map's original classes for
    reclassification downstream.

lulc/esa:
  title: ESA CCI / C3S annual land cover
  tagline: One global map a year, 1992 to 2022
  about: >-
    ESA Climate Change Initiative maps (1992-2015) continued by Copernicus C3S (2016 on). About 300 m cells, each one
    class of the LCCS legend.

lulc/glc_fcs30d:
  title: GLC_FCS30D global land cover at 30 m
  tagline: Global 30 m land cover on the 1-arcsecond rung, 1990, 2010 and 2022
  about: >-
    The GLC_FCS30D fine-classification record (Liu, Zhang and Li 2025; Zenodo 15063683) rebuilt as one global POG a year: each
    of its 961 five-degree tiles resampled once by nearest neighbour onto the 1-arcsecond lattice, the ocean, the islands and
    the filled cells the record leaves out taken from the ESA CCI / C3S map of the same year, the legend's palette in the
    header. The record's 26 years (1985, 1990, 1995 and 2000 to 2022) are all built; 1990, 2010 and 2022 are published here,
    and every year is available from the TEEMs internal base data on request.

cartographic:
  title: Cartographic
  tagline: Region boundaries as vectors and rasters
  about: >-
    The region definitions every devstack model shares: country and marine-zone boundaries on the POG lattice, with
    tables linking them to GTAP, ISO3, FAO and GADM.

cartographic/ee:
  title: Earth-Economy regions (ee_r264 and eemarine_r566)
  tagline: 264 land regions, 566 with marine zones
  about: >-
    Regions built from OpenStreetMap boundaries so every 10-arcsecond cell belongs to exactly one. Geopackages,
    correspondence CSVs and zone-id POGs. ODbL.

osm:
  title: OpenStreetMap extracts
  tagline: Every OSM feature of a region, sorted and merged
  about: >-
    Regional cuts of the OpenStreetMap planet file, one folder per country or city: 47 themed GeoPackages, ten merged
    layers, and presence, distance and density rasters. ODbL.

osm/rwa:
  title: Rwanda
  tagline: The whole country, 1.7 million features
  about: >-
    Rich in imports: 1.45 million machine-mapped building footprints, a 5,900-point building survey, DHIS2 health
    catchments and a flood-damage survey on Lake Kivu.

osm/rwa/theme_vectors:
  title: Themes
  tagline: 47 themed GeoPackages, one per subject
  about: >-
    The lossless cut. Every feature goes to its primary theme's file, plus a secondary theme's when another tag
    matches. Columns: theme, class, subclass, tags as JSON.

osm/rwa/product_vectors:
  title: Products
  tagline: Ten single-layer files merged from the themes
  about: >-
    Facilities, buildings with survey points joined on, land cover and its tiled mosaic, boundaries, settlements,
    transport, water and utility lines, utility nodes.

osm/rwa/derived_rasters:
  title: Rasters
  tagline: Presence, distance and density surfaces
  about: >-
    Presence of roads, main roads, energy, power lines and buildings; distance to roads; building density. Global
    10-arcsecond POGs that stack with every other raster.

osm/saint_paul_mn:
  title: Saint Paul, Minnesota
  tagline: A city cut by its own boundary
  about: >-
    102,000 buildings and 67,000 road segments inside the admin_level 8 boundary, looked up in the planet file.
    Mapped by residents: addresses, waste and railways are dense.

osm/saint_paul_mn/theme_vectors:
  title: Themes
  tagline: 47 themed GeoPackages, one per subject
  about: >-
    The lossless cut. Every feature goes to its primary theme's file, plus a secondary theme's when another tag
    matches. Columns: theme, class, subclass, tags as JSON.

osm/saint_paul_mn/product_vectors:
  title: Products
  tagline: Ten single-layer files merged from the themes
  about: >-
    Facilities, buildings with facility function joined on, land cover and its tiled mosaic, boundaries, settlements,
    transport, water and utility lines, utility nodes.

osm/saint_paul_mn/derived_rasters:
  title: Rasters
  tagline: Presence, distance and density surfaces
  about: >-
    Presence of roads, main roads, energy, power lines and buildings; distance to roads; building density. Global
    10-arcsecond POGs; the city is about 70 by 40 cells.
